server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 47.100.22.158:8848
        namespace: yangjingxi
      config:
        server-addr: 47.100.22.158:8848
        namespace: yangjingxi
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/shop/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/employee/**


